<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>温森神社 YouTube Player</title>

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: sans-serif;
}

#start {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

#playButton {
    font-size: 42px;
    padding: 24px 48px;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
}

#player {
    position: fixed;
    inset: 0;
    display: none;
}

#player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<div id="start">
    <button id="playButton" type="button">▶ 再生する</button>
</div>

<div id="player"></div>

<script>
document.getElementById("playButton").addEventListener("click", function () {

    var frame = document.createElement("iframe");

    frame.src =
        "https://www.youtube.com/embed/psOfZ9NHwgs?autoplay=1&controls=1&rel=0&playsinline=1";

    frame.title = "温森神社 YouTube Player";

    frame.allow =
        "autoplay; encrypted-media; picture-in-picture; fullscreen";

    frame.referrerPolicy =
        "strict-origin-when-cross-origin";

    frame.allowFullscreen = true;

    document.getElementById("player").appendChild(frame);

    document.getElementById("start").style.display = "none";
    document.getElementById("player").style.display = "block";
});
</script>

</body>
</html>
